name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sbom-scanner:ci .

      - name: Start service
        run: |
          # The scheduler is disabled here so the manual scan below does not compete with a background cycle.
          docker run -d \
            --name sbom-scanner-ci \
            -p 8100:8100 \
            -e SCHEDULER_ENABLED=false \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            sbom-scanner:ci
          sleep 5

      - name: Health check
        run: |
          STATUS=$(curl -sf http://localhost:8100/health | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          echo "Health: $STATUS"
          [ "$STATUS" = "ok" ]

      - name: Status endpoint
        run: curl -sf http://localhost:8100/status

      - name: List images endpoint
        run: curl -sf http://localhost:8100/images

      - name: Trigger scan and wait
        run: |
          SCAN_ID=$(curl -sf -X POST http://localhost:8100/scan \
            -H "Content-Type: application/json" \
            -d '{"target": "images", "severity_threshold": "critical"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['scan_id'])")
          echo "Scan ID: $SCAN_ID"

          # Poll up to 10 minutes
          for i in $(seq 1 120); do
            STATUS=$(curl -sf "http://localhost:8100/scan/$SCAN_ID" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            echo "[$i] $STATUS"
            if [[ "$STATUS" == "completed" || "$STATUS" == "failed" ]]; then break; fi
            sleep 5
          done

          [ "$STATUS" = "completed" ]

      - name: No scratch data left behind
        run: |
          LEFT=$(docker exec sbom-scanner-ci sh -c 'ls /data/sbom-data/work | wc -l')
          echo "Leftover work dirs: $LEFT"
          [ "$LEFT" = "0" ]
